name: Sync GitHub Release to GitCode

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to sync (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync-to-gitcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GITCODE_TOKEN secret
        id: check_secret
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "GITCODE_TOKEN is not set in repository secrets. Add GITCODE_TOKEN under Settings -> Secrets and variables -> Actions."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync release metadata & .deb assets to GitCode
        if: steps.check_secret.outputs.has_token == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITCODE_OWNER: m0_60692907
          GITCODE_REPO: AgentOS
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: python3 scripts/sync_gitcode_release.py
